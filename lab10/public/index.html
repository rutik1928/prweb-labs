<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ввод инструментов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Введите список инструментов</h1>
        <p>Каждый инструмент с новой строки</p>
        
        <form id="toolsForm">
            <textarea name="tools" id="toolsInput" rows="10" required></textarea>
            <button type="submit">Обработать и сохранить</button>
        </form>
        
        <div id="originalList">
            <h2>Последний введенный список:</h2>
            <ul id="lastOriginalList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
